<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notch Channel Playground</title>
<style>
:root {
  --bg: #0b0b0d; --panel: #151517; --panel-2: #1c1c1f; --line: #2a2a2e; --fg: #f2f2f4;
  --muted: #8e8e95; --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: rgba(11,11,13,.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
.notch { width: 64px; height: 14px; background: #000; border: 1px solid #333; border-top: 0; border-radius: 0 0 8px 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--panel-2); color: var(--muted); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--green); } .dot.bad { background: var(--red); }
main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px 40px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.card h2 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--panel-2); padding: 3px; border-radius: 9px; width: fit-content; max-width: 100%; flex-wrap: wrap; }
.tabs button { background: none; border: 0; color: var(--muted); padding: 5px 12px; border-radius: 7px; font: inherit; cursor: pointer; }
.tabs button.on { background: #2c2c30; color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 11.5px; min-width: 0; }
label.f.wide { grid-column: 1 / -1; }
input, select, textarea { background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 7px 9px; font: 13px/1.4 inherit; font-family: inherit; min-width: 0; width: 100%; }
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(10,132,255,.5); outline-offset: -1px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 120px; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg button { background: none; border: 0; color: var(--muted); padding: 6px 10px; font: inherit; cursor: pointer; }
.seg button.on { background: #2c2c30; color: var(--fg); }
.seg.small button { padding: 3px 9px; font-size: 12px; }
button.btn { background: #2c2c30; color: var(--fg); border: 1px solid #3a3a3f; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
button.btn:hover { background: #36363b; }
button.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
button.btn.primary:hover { filter: brightness(1.1); }
button.btn.small { padding: 3px 8px; font-size: 12px; }
button.btn.danger { color: var(--red); }
.hint { color: var(--muted); font-size: 12px; }
pre.json { margin: 0; background: #0f0f11; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
.action-row { display: grid; grid-template-columns: 1fr 90px 1.3fr auto; gap: 6px; margin-bottom: 6px; }
@media (max-width: 560px) { .action-row { grid-template-columns: 1fr 1fr; } }
.scenarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.scn { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--fg); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.scn:hover { border-color: #46464c; }
.scn b { font-size: 12.5px; }
.scn span { color: var(--muted); font-size: 11.5px; }
.scn.running { border-color: var(--blue); }
.log { display: flex; flex-direction: column; gap: 6px; max-height: 520px; overflow: auto; }
.entry { background: var(--panel-2); border-radius: 9px; padding: 8px 10px; font-size: 12px; }
.entry .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry .meta { color: var(--muted); margin-left: auto; font-size: 11px; white-space: nowrap; }
.entry pre { margin: 6px 0 0; font: 11.5px/1.45 var(--mono); color: #c9c9cf; white-space: pre-wrap; word-break: break-word; }
.entry.note { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.st { font: 600 11px var(--mono); padding: 1px 6px; border-radius: 5px; background: #333; }
.st.s2 { background: rgba(48,209,88,.18); color: var(--green); }
.st.s4 { background: rgba(255,159,10,.16); color: var(--orange); }
.st.s5, .st.s0 { background: rgba(255,69,58,.18); color: var(--red); }
.method { font: 600 11px var(--mono); color: var(--muted); }
.sent { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; }
.sent .it { display: flex; gap: 8px; align-items: center; background: var(--panel-2); border-radius: 8px; padding: 5px 8px; }
.sent .it code { font: 11.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
.sent .it .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.checks { width: 100%; border-collapse: collapse; font-size: 12px; }
table.checks td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
table.checks td.r { text-align: right; white-space: nowrap; font-family: var(--mono); }
.pass { color: var(--green); } .fail { color: var(--red); }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="notch"></div>
  <h1>Notch Channel Playground</h1>
  <span class="pill" id="disc"><span class="dot"></span><span data-i18n="disc.looking"></span></span>
  <span class="hint" id="discPath"></span>
  <span style="flex:1"></span>
  <div class="seg small" id="langSeg" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="zh">中文</button>
  </div>
  <button class="btn small" onclick="loadDiscovery()" data-i18n="refresh"></button>
</header>

<main>
  <div class="col">
    <section class="card">
      <div class="tabs" id="composerTabs">
        <button class="on" data-tab="v2" data-i18n="tab.v2"></button>
        <button data-tab="v1" data-i18n="tab.v1"></button>
        <button data-tab="raw" data-i18n="tab.raw"></button>
      </div>

      <!-- v2 -->
      <div id="tab-v2">
        <div class="grid">
          <label class="f"><span>id</span>
            <div class="row"><input id="v2-id" class="grow" data-i18n-ph="ph.generated"><button class="btn small" onclick="$('v2-id').value='pg-'+Math.random().toString(36).slice(2,8);render()" data-i18n="random"></button></div>
          </label>
          <label class="f"><span>source</span><input id="v2-source" placeholder="claude-code" value="playground"></label>
          <label class="f"><span>thread</span><input id="v2-thread" placeholder="session-42"></label>
          <label class="f"><span>level</span>
            <div class="seg" id="v2-level">
              <button data-v="passive">passive</button><button data-v="active" class="on">active</button><button data-v="time-sensitive">time-sensitive</button>
            </div>
          </label>
          <label class="f"><span data-i18n="f.iconKind"></span>
            <select id="v2-iconKind"><option value="" data-i18n="opt.iconNone"></option><option value="sf_symbol" selected>sf_symbol</option><option value="app_bundle">app_bundle</option><option value="png_base64">png_base64</option></select>
          </label>
          <label class="f"><span data-i18n="f.iconValue"></span>
            <input id="v2-iconValue" list="iconPresets" value="hammer.fill">
            <input id="v2-iconFile" type="file" accept="image/png" class="hidden">
          </label>
          <label class="f wide"><span>title</span><input id="v2-title" data-default="d.v2.title"></label>
          <label class="f wide"><span>subtitle</span><input id="v2-subtitle" data-default="d.v2.subtitle"></label>
          <label class="f wide"><span><span>body</span> <span data-i18n="f.bodyHint"></span></span>
            <textarea id="v2-body" rows="3" data-default="d.v2.body"></textarea></label>
          <label class="f"><span data-i18n="f.duration"></span><input id="v2-duration" type="number" min="0" step="0.5" placeholder="4"></label>
          <label class="f"><span>sound</span><select id="v2-sound"><option value="" data-i18n="opt.omitNone"></option><option>none</option><option>default</option></select></label>
          <label class="f"><span>open</span>
            <select id="v2-openKind"><option value="" data-i18n="opt.none"></option><option value="url">url</option><option value="app">app</option></select>
          </label>
          <label class="f"><span data-i18n="f.openValue"></span><input id="v2-openValue" list="openPresets" data-i18n-ph="ph.openValue"></label>
        </div>

        <div style="margin-top:12px">
          <div class="row" style="margin-bottom:6px"><b style="font-size:12px">actions</b><span class="hint" data-i18n="actions.hint"></span><span style="flex:1"></span><button class="btn small" onclick="addAction()" data-i18n="actions.add"></button></div>
          <div id="v2-actions"></div>
        </div>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" onclick="sendV2()" data-i18n="send"></button>
          <button class="btn" onclick="sendV2(true)" data-i18n="sendThrice"></button>
          <span class="hint" data-i18n="sendShortcut"></span>
        </div>
        <details style="margin-top:12px" open><summary class="hint" data-i18n="payload"></summary><pre class="json" id="v2-preview"></pre></details>
      </div>

      <!-- v1 -->
      <div id="tab-v1" class="hidden">
        <div class="grid">
          <label class="f"><span>id</span><input id="v1-id" data-i18n-ph="ph.generated"></label>
          <label class="f"><span>icon (sf_symbol)</span><input id="v1-icon" list="iconPresets" value="bell.badge"></label>
          <label class="f wide"><span>title</span><input id="v1-title" data-default="d.v1.title"></label>
          <label class="f wide"><span>subtitle</span><input id="v1-subtitle" data-default="d.v1.subtitle"></label>
          <label class="f wide"><span>body</span><textarea id="v1-body" rows="2" data-default="d.v1.body"></textarea></label>
          <label class="f"><span data-i18n="f.duration"></span><input id="v1-duration" type="number" min="0" step="0.5" placeholder="4"></label>
          <label class="f"><span>sticky</span><select id="v1-sticky"><option value="" data-i18n="opt.omit"></option><option value="true">true</option><option value="false">false</option></select></label>
          <label class="f"><span>sound</span><select id="v1-sound"><option value="" data-i18n="opt.omit"></option><option>none</option><option>default</option></select></label>
          <label class="f"><span>action title</span><input id="v1-actionTitle" placeholder="Open"></label>
          <label class="f wide"><span>action url</span><input id="v1-actionURL" placeholder="https://github.com"></label>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn primary" onclick="sendV1()" data-i18n="sendV1"></button></div>
        <details style="margin-top:12px" open><summary class="hint" data-i18n="payload"></summary><pre class="json" id="v1-preview"></pre></details>
      </div>

      <!-- raw -->
      <div id="tab-raw" class="hidden">
        <div class="grid">
          <label class="f"><span>method</span><select id="raw-method"><option>POST</option><option>DELETE</option><option>GET</option><option>PUT</option></select></label>
          <label class="f"><span>path</span><input id="raw-path" value="/v2/notifications"></label>
          <label class="f"><span>token</span>
            <select id="raw-token"><option value="auto" data-i18n="opt.tokenAuto"></option><option value="none" data-i18n="opt.tokenNone"></option><option value="wrong" data-i18n="opt.tokenWrong"></option></select>
          </label>
          <label class="f"><span>content-type</span><input id="raw-ctype" value="application/json"></label>
          <label class="f wide"><span data-i18n="f.extraHeaders"></span><input id="raw-headers" placeholder='{"Origin": "https://example.com"}'></label>
          <label class="f wide"><span data-i18n="f.rawBody"></span><textarea id="raw-body" rows="6">{"title": "Raw hello", "level": "active"}</textarea></label>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn primary" onclick="sendRaw()" data-i18n="sendRaw"></button></div>
      </div>
    </section>

    <section class="card">
      <h2><span data-i18n="scn.title"></span> <span class="sub" data-i18n="scn.sub"></span></h2>
      <div class="scenarios" id="scenarios"></div>
    </section>
  </div>

  <div class="col">
    <section class="card">
      <h2><span data-i18n="chk.title"></span> <span class="sub" data-i18n="chk.sub"></span></h2>
      <div class="row"><button class="btn" onclick="runChecks()" data-i18n="chk.run"></button><span class="hint" id="checkSummary" data-i18n="chk.hint"></span></div>
      <table class="checks" id="checks" style="margin-top:8px"></table>
    </section>

    <section class="card">
      <h2><span data-i18n="sent.title"></span> <span class="sub" data-i18n="sent.sub"></span><span style="flex:1"></span><button class="btn small danger" onclick="withdrawAll()" data-i18n="sent.withdrawAll"></button></h2>
      <div class="sent" id="sent"></div>
    </section>

    <section class="card">
      <h2><span data-i18n="log.title"></span><span style="flex:1"></span><button class="btn small" onclick="$('log').innerHTML=''" data-i18n="log.clear"></button></h2>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>

<datalist id="iconPresets">
  <option value="hammer.fill"><option value="bell.badge"><option value="terminal"><option value="checkmark.circle.fill">
  <option value="xmark.octagon.fill"><option value="sparkles"><option value="arrow.triangle.branch"><option value="not.a.real.symbol">
  <option value="com.apple.Terminal"><option value="com.googlecode.iterm2"><option value="com.mitchellh.ghostty">
  <option value="com.microsoft.VSCode"><option value="com.apple.Safari"><option value="com.apple.finder">
</datalist>
<datalist id="openPresets">
  <option value="https://github.com"><option value="com.apple.Terminal"><option value="com.apple.Safari">
  <option value="com.microsoft.VSCode"><option value="vscode://file/Users"><option value="x-apple.systempreferences:">
</datalist>

<script>
// ================================================================ i18n
// Field names that are also wire names (title, level, open…) stay in English in both languages:
// they are what a sender types. Everything else, including what the scenarios send to the notch,
// follows the chosen language.
const STRINGS = {
  en: {
    'disc.looking': 'looking for the channel…',
    'disc.missing': 'no discovery file — is the app running with the channel on?',
    'refresh': 'Refresh',
    'tab.v2': 'v2 notification', 'tab.v1': 'v1 reminder', 'tab.raw': 'Raw request',
    'ph.generated': 'generated if empty', 'ph.openValue': 'https://… or bundle id',
    'random': 'random',
    'f.iconKind': 'icon kind', 'f.iconValue': 'icon value', 'f.duration': 'duration (s)', 'f.openValue': 'open value',
    'f.bodyHint': '(inline Markdown: **bold**, `code`, [link](https://example.com))',
    'f.extraHeaders': 'extra headers (JSON)', 'f.rawBody': 'body (sent as-is; empty for none)',
    'opt.iconNone': 'none (bell)', 'opt.omitNone': 'omit (none)', 'opt.none': 'none', 'opt.omit': 'omit',
    'opt.tokenAuto': 'discovery token', 'opt.tokenNone': 'none', 'opt.tokenWrong': 'wrong token',
    'actions.hint': 'up to 3 (a 4th is allowed here, to see it refused)', 'actions.add': '+ action',
    'action.ph.url': 'https://…', 'action.ph.copy': 'text to copy', 'action.ph.title': 'title',
    'send': 'Send', 'sendThrice': 'Send ×3 (same id → in place)', 'sendShortcut': '⌘↩ to send',
    'sendV1': 'Send v1', 'sendRaw': 'Send raw', 'payload': 'payload',
    'scn.title': 'Scenarios', 'scn.sub': 'scripted sequences — watch the notch while they run',
    'chk.title': 'Protocol checks', 'chk.sub': 'every route and refusal, against expected status codes',
    'chk.run': 'Run checks', 'chk.hint': 'Accepted ones are sent as passive and withdrawn afterwards, so they do not pile up.',
    'chk.summary': '{pass} / {total} passed', 'chk.want': 'want', 'chk.got': 'got',
    'sent.title': 'Sent', 'sent.sub': 'ids the channel accepted this session', 'sent.withdrawAll': 'Withdraw all',
    'sent.empty': 'Nothing yet.', 'sent.withdraw': 'Withdraw', 'sent.untitled': '(untitled)',
    'log.title': 'Log', 'log.clear': 'Clear',
    'log.badHeaders': 'extra headers are not valid JSON',
    'label.update': 'update {n}', 'label.withdrawAll': 'withdraw all', 'label.cleanup': 'check cleanup', 'label.check': 'check: {name}',
    'd.v2.title': 'Build finished', 'd.v2.subtitle': '12s · main', 'd.v2.body': '12 files typechecked, `0` errors.',
    'd.v1.title': 'Legacy reminder', 'd.v1.subtitle': 'sent to POST /reminder', 'd.v1.body': 'v1 senders keep working unchanged.',
    'd.action.title': 'Copy SHA',
  },
  zh: {
    'disc.looking': '正在查找通道…',
    'disc.missing': '没有找到发现文件 —— app 是否在运行，通道是否已开启？',
    'refresh': '刷新',
    'tab.v2': 'v2 通知', 'tab.v1': 'v1 提醒', 'tab.raw': '原始请求',
    'ph.generated': '留空则自动生成', 'ph.openValue': 'https://… 或 bundle id',
    'random': '随机',
    'f.iconKind': '图标类型', 'f.iconValue': '图标值', 'f.duration': '时长（秒）', 'f.openValue': 'open 目标',
    'f.bodyHint': '（行内 Markdown：**粗体**、`代码`、[链接](https://example.com)）',
    'f.extraHeaders': '额外请求头（JSON）', 'f.rawBody': '请求体（原样发送，留空则不带）',
    'opt.iconNone': '无（铃铛）', 'opt.omitNone': '不填（none）', 'opt.none': '无', 'opt.omit': '不填',
    'opt.tokenAuto': '发现文件里的 token', 'opt.tokenNone': '不带', 'opt.tokenWrong': '错误的 token',
    'actions.hint': '最多 3 个（这里允许加第 4 个，用来看它被拒绝）', 'actions.add': '+ 按钮',
    'action.ph.url': 'https://…', 'action.ph.copy': '要复制的文本', 'action.ph.title': '标题',
    'send': '发送', 'sendThrice': '连发 3 次（同 id → 原地更新）', 'sendShortcut': '⌘↩ 发送',
    'sendV1': '发送 v1', 'sendRaw': '发送原始请求', 'payload': '请求内容',
    'scn.title': '场景', 'scn.sub': '编排好的一组操作 —— 运行时盯着刘海看',
    'chk.title': '协议检查', 'chk.sub': '每条路由和每种拒绝，对照期望的状态码',
    'chk.run': '运行检查', 'chk.hint': '会被接受的用例以 passive 发送，跑完自动撤回，不会堆积。',
    'chk.summary': '通过 {pass} / {total}', 'chk.want': '期望', 'chk.got': '实际',
    'sent.title': '已发送', 'sent.sub': '本次会话中通道接受的 id', 'sent.withdrawAll': '全部撤回',
    'sent.empty': '还没有。', 'sent.withdraw': '撤回', 'sent.untitled': '（无标题）',
    'log.title': '日志', 'log.clear': '清空',
    'log.badHeaders': '额外请求头不是合法的 JSON',
    'label.update': '第 {n} 次更新', 'label.withdrawAll': '全部撤回', 'label.cleanup': '检查后清理', 'label.check': '检查：{name}',
    'd.v2.title': '构建完成', 'd.v2.subtitle': '12 秒 · main', 'd.v2.body': '12 个文件类型检查通过，`0` 个错误。',
    'd.v1.title': '旧版提醒', 'd.v1.subtitle': '发往 POST /reminder', 'd.v1.body': 'v1 发送方无需任何改动即可继续使用。',
    'd.action.title': '复制 SHA',
  },
};

const LANG_KEY = 'notch-channel-playground.lang';
let lang = (() => {
  try { const saved = localStorage.getItem(LANG_KEY); if (saved === 'en' || saved === 'zh') return saved; } catch {}
  return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
})();

function t(key, vars = {}) {
  const s = STRINGS[lang][key] ?? STRINGS.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}
/// Pick between two literal strings — for scenario content, where a key per line would be noise.
const L = (en, zh) => (lang === 'zh' ? zh : en);

function setLang(next) {
  const prev = lang;
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch {}
  document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('#langSeg button').forEach((b) => b.classList.toggle('on', b.dataset.lang === next));
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  // Example values follow the language only while they are still the untouched example.
  document.querySelectorAll('[data-default]').forEach((el) => {
    const key = el.dataset.default;
    if (prev === null || el.value === (STRINGS[prev][key] ?? '')) el.value = t(key);
  });

async function call(spec, label) {
  let res;
  try {
    res = await (await fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(spec) })).json();
  } catch (e) {
    res = { ok: false, error: String(e) };
  }
  log(spec, res, label);
  if (res.ok && res.status === 202 && res.body && res.body.id) {
    const title = (spec.body && typeof spec.body === 'object' && spec.body.title) || '';
    sent.set(res.body.id, title);
    renderSent();
  }
  if (res.ok && res.status === 200 && res.body && res.body.status === 'withdrawn') {
    sent.delete(res.body.id);
    renderSent();
  }
  return res;
}
const post = (path, body, extra = {}) => call({ method: 'POST', path, body, ...extra }, extra.label);
const notify = (body, label) => post('/v2/notifications', body, { label });
const withdraw = (id, label) => call({ method: 'DELETE', path: '/v2/notifications/' + encodeURIComponent(id) }, label);

function log(spec, res, label) {
  const el = document.createElement('div');
  el.className = 'entry';
  if (!res.ok) {
    el.innerHTML = `<div class="top"><span class="st s0">ERR</span><span>${esc(res.error)}</span></div>`;
  } else {
    const cls = 's' + String(res.status)[0];
    el.innerHTML = `<div class="top"><span class="st ${cls}">${res.status}</span><span class="method">${spec.method}</span><span>${esc(spec.path)}</span>${label ? `<span class="hint">· ${esc(label)}</span>` : ''}<span class="meta">${res.ms} ms · ${new Date().toLocaleTimeString()}</span></div>` +
      `<pre>${esc(JSON.stringify(res.body))}</pre>`;
  }
  $('log').prepend(el);
}
function note(text) {
  const el = document.createElement('div');
  el.className = 'entry note';

  $('log').prepend(el);
}

function renderSent() {

function buildV2() {

  if (kind === 'png_base64') { if (pngData) p.icon = { kind, value: pngData }; }

  if (v('v2-subtitle')) p.subtitle = v('v2-subtitle');

function buildV1() {

function render() {

    [L('unknown path', '未知路径'), 404, { path: '/v2/activities', body: { title: 't' } }, 'not_found'],
    [L('withdraw unknown id', '撤回不存在的 id'), 200, { method: 'DELETE', path: '/v2/notifications/never-sent' }, 'withdrawn'],
    [L('withdraw id with ":"', '撤回含 ":" 的 id'), 200, { method: 'DELETE', path: '/v2/notifications/' + encodeURIComponent('claude:42') }, 'withdrawn'],
  ];
}
async function runChecks() {
  const table = $('checks');
  table.innerHTML = '';
  const list = checks();
  let pass = 0;
  const accepted = [];
  for (const [name, want, spec, code] of list) {
    const full = { method: 'POST', path: '/v2/notifications', ...spec };
    const res = await call(full, t('label.check', { name }));
    const got = res.ok ? res.status : 'ERR';
    const body = res.ok ? res.body : res.error;
    const codeOK = !code || (body && (body.error === code || body.status === code || (code === 'v1' && body.status === 'queued')));
    const ok = got === want && codeOK;
    if (ok) pass++;
    if (got === 202 && body.id) accepted.push(body.id);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'}</td><td>${esc(name)}<div class="hint">${esc(JSON.stringify(body))}</div></td><td class="r">${esc(t('chk.want'))} ${want}<br>${esc(t('chk.got'))} ${got}</td>`;
    table.appendChild(tr);
  }
  for (const id of accepted) await withdraw(id, t('label.cleanup'));
  const summary = $('checkSummary');
  summary.removeAttribute('data-i18n');
  summary.innerHTML = `<span class="${pass === list.length ? 'pass' : 'fail'}">${esc(t('chk.summary', { pass, total: list.length }))}</span>`;
}

lang = null;
setLang(initialLang);
