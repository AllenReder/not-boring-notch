name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build Not Boring Notch
    strategy:
      matrix:
        platform:
          - macOS
        xcode:
          - ^16
        scheme:
          - NotBoringNotch
    # macos-latest now resolves to macos-26, which does not ship Xcode 16.
    # Keep this legacy main-branch build on an image with the requested toolchain.
    runs-on: macos-15
    steps:
    - name: Code Checkout
      # TODO: pin to immutable SHA
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run tests
      run: ./scripts/run-tests.sh
    # Two promises this repository had no way to enforce: the rebrand stays rebranded, and
    # the version settings RELEASING.md asks you to bump by hand stay in step. Both are one
    # grep over tracked files, and both are steps in this job rather than workflows of their
    # own, because neither deserves a job's worth of runner time.
    - name: Check the brand
      run: ./scripts/check-branding.sh
    - name: Check the version settings
      run: ./scripts/check-version.sh
    - # TODO: pin to immutable SHA
      uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
      with:
        xcode: ${{ matrix.xcode }}
        platform: ${{ matrix.platform }}
        scheme: ${{ matrix.scheme }}
        action: build
        verbosity: xcpretty
        upload-logs: always
        configuration: release
